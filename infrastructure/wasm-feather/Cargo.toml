[package]
name = "wasm-feather"
version = "0.1.0"
edition = "2021"
description = "Feathering algorithm for sprite atlases: 128x128 → 160x160 with mirrored padding and alpha gradient"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
