[workspace]
resolver = "2"
members = [
    "core",
    "adapters",
    "infrastructure/wasm",
    "infrastructure/wasm-canvas",
    "infrastructure/wasm-feather",
]

[workspace.dependencies]
glam = { version = "0.30", features = ["serde"] }
rhai = { version = "1.19", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
